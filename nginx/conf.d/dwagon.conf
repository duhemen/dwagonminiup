# ===== HTTP Server (redirect ke HTTPS kalau ada SSL, atau serve langsung) =====
server {
  listen 80;
  server_name _;

  # Untuk development / tanpa SSL: serve langsung
  # Untuk production dengan SSL: uncomment baris redirect di bawah

  # return 301 https://$host$request_uri;

  # ===== Health check =====
  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # ===== WebSocket (Socket.io) =====
  location /socket.io/ {
    proxy_pass http://central;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # ===== Login rate limit =====
  location = /api/auth/login {
    limit_req zone=login_limit burst=3 nodelay;
    proxy_pass http://central;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ===== API Central =====
  location /api/ {
    limit_req zone=api_limit burst=120 nodelay;
    proxy_pass http://central;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # ===== Frontend SPA =====
  location / {
    proxy_pass http://dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

